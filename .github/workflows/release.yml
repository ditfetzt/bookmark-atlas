---
name: Release

# Publishing is CI-driven: pushing a vX.Y.Z tag validates the version, runs the
# test suite (via prepublishOnly), publishes to npm, and opens a GitHub release.
#
# The first publish has to be done by hand with `npm publish`, because npm
# trusted publishing can only be configured for a package that already exists.
# After that, configure the trusted publisher for this repository and workflow
# on npmjs.com and no long-lived token is needed anywhere.

on:
  push:
    tags: [v*]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write  # open the GitHub release
      id-token: write  # npm trusted publishing and provenance
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $version"
            exit 1
          fi
          echo "releasing $version"

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Deliberately not caching: a poisoned npm cache in a publish job is
          # a route to shipping an artefact nobody built. See zizmor.
          package-manager-cache: false

      - run: npm ci

      # npm publish runs prepublishOnly, which is typecheck + test, so a
      # failing suite cannot reach the registry.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Open the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
