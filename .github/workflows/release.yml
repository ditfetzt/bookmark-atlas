---
name: Release

# Publishing is CI-driven: pushing a vX.Y.Z tag validates the version, runs the
# test suite (via prepublishOnly), publishes to npm, and opens a GitHub release.
#
# The first publish has to be done by hand with `npm publish`, because npm
# trusted publishing can only be configured for a package that already exists.
# After that, configure the trusted publisher for this repository and workflow
# on npmjs.com and no long-lived token is needed anywhere.

on:
  push:
    tags: [v*]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write  # open the GitHub release
      id-token: write  # npm trusted publishing and provenance
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $version"
            exit 1
          fi
          echo "releasing $version"

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Deliberately not caching: a poisoned npm cache in a publish job is
          # a route to shipping an artefact nobody built. See zizmor.
          package-manager-cache: false

      - run: npm ci

      # Idempotent: re-tagging a version that is already on the registry is a
      # no-op rather than a failed run. The first release is published by hand
      # (trusted publishing needs a package that already exists), so its tag
      # arrives after the fact.
      #
      # npm publish also runs prepublishOnly, which is typecheck + test, so a
      # failing suite cannot reach the registry.
      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish"
            exit 0
          fi
          npm publish --provenance --access public

      # Release notes come from CHANGELOG.md, so what a reader sees on the
      # release page is written rather than scraped from commit subjects. Falls
      # back to generated notes if the version has no section.
      - name: Open the GitHub release
        run: |
          version="$(node -p "require('./package.json').version")"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const version = process.argv[1];
            const heading = /^## \\[?v?/;
            const lines = readFileSync("CHANGELOG.md", "utf8").split("\n");
            const isTarget = (line) =>
              line.startsWith(`## [${version}]`) ||
              line.trim() === `## ${version}`;
            const start = lines.findIndex(isTarget);
            if (start === -1) {
              console.error(`no CHANGELOG section for ${version}`);
              process.exit(1);
            }
            let end = lines.length;
            for (let i = start + 1; i < lines.length; i += 1) {
              if (heading.test(lines[i])) { end = i; break; }
            }
            const body = lines
              .slice(start + 1, end)
              .filter((line) => !/^\[[^\]]+\]:\s+\S/.test(line))
              .join("\n")
              .trim();
            writeFileSync("/tmp/notes.md", `${body}\n`);
          ' "$version"
          gh release create "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
