<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-labelledby="atlas-title atlas-desc">
  <title id="atlas-title">The Bookmark Atlas /bookmarks palette</title>
  <desc id="atlas-desc">A search query is typed into the /bookmarks palette. As it types, the list narrows to the two bookmarks that match, the other rows dim, and the selection moves to the second match.</desc>

  <defs>
    <style>
      .ui    { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .prompt{ font-size: 15px; fill: #7ee787; }
      .query { font-size: 15px; fill: #e6edf3; }
      .idx   { font-size: 13px; fill: #6e7681; }
      .title { font-size: 14px; fill: #e6edf3; }
      .meta  { font-size: 12px; fill: #8b949e; }
      .cursor{ fill: #7ee787; }

      /* One 8s loop: rest, type, narrow, move the selection, hold, reset. */
      #query-group  { animation: queryFade 8s ease-in-out infinite; }
      #typed rect   { animation: type 8s steps(1, end) infinite; }
      #cursor       { animation: blink 1.06s step-end infinite; }
      #highlight    { animation: slide 8s cubic-bezier(.4,0,.2,1) infinite; }
      .unmatched    { animation: dim 8s ease-in-out infinite; }

      @keyframes type {
        0%, 6%      { width: 0px; }
        7.11%       { width: 9px; }
        8.21%       { width: 18px; }
        9.32%       { width: 27px; }
        10.42%      { width: 36px; }
        11.53%      { width: 45px; }
        12.63%      { width: 54px; }
        13.74%      { width: 63px; }
        14.84%      { width: 72px; }
        15.95%      { width: 81px; }
        17.05%      { width: 90px; }
        18.16%      { width: 99px; }
        19.26%      { width: 108px; }
        20.37%      { width: 117px; }
        21.47%      { width: 126px; }
        22.58%      { width: 135px; }
        23.68%      { width: 144px; }
        24.79%      { width: 153px; }
        25.89%      { width: 162px; }
        27%, 88%    { width: 171px; }
        88.1%, 100% { width: 0px; }
      }
      @keyframes queryFade {
        0%, 82%     { opacity: 1; }
        88%         { opacity: 0; }
        88.1%       { opacity: 0; }
        92%, 100%   { opacity: 1; }
      }
      @keyframes blink {
        0%, 49%     { opacity: 1; }
        50%, 100%   { opacity: 0; }
      }
      @keyframes dim {
        0%, 32%     { opacity: .8; }
        38%, 82%    { opacity: .2; }
        88%, 100%   { opacity: .8; }
      }
      @keyframes slide {
        0%, 40%     { transform: translateY(0); }
        48%, 82%    { transform: translateY(34px); }
        88%, 100%   { transform: translateY(0); }
      }

      /* Honour a reduced-motion preference with a complete still frame:
         the query typed, the two matches kept, the selection on the second. */
      @media (prefers-reduced-motion: reduce) {
        #query-group, #typed rect, #cursor, #highlight, .unmatched { animation: none; }
        #typed rect { width: 171px; }
        .unmatched  { opacity: .2; }
        #highlight  { transform: translateY(34px); }
        #cursor     { opacity: 1; }
      }
    </style>

    <clipPath id="typed">
      <rect x="127" y="26" width="0" height="26" />
    </clipPath>
  </defs>

  <rect x="1" y="1" width="818" height="238" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2" />

  <g class="ui">
    <text class="prompt" x="28" y="46">/bookmarks</text>
    <g id="query-group" clip-path="url(#typed)">
      <text class="query" x="127" y="46">local-first agents</text>
      <rect id="cursor" class="cursor" x="289" y="30" width="9" height="18" />
    </g>
  </g>

  <line x1="20" y1="62" x2="800" y2="62" stroke="#21262d" stroke-width="1" />

  <rect id="highlight" x="20" y="70" width="780" height="34" rx="6"
        fill="#1f6feb" fill-opacity="0.15" stroke="#58a6ff" stroke-opacity="0.5" stroke-width="1" />

  <g class="ui">
    <!-- Row 0 — matches "local-first" -->
    <text class="idx"   x="44" y="92"  text-anchor="end">1</text>
    <text class="title" x="62" y="92">mlx — local-first ML on Apple silicon</text>
    <text class="meta"  x="722" y="92"  text-anchor="end">★ 12.4k</text>
    <text class="meta"  x="784" y="92"  text-anchor="end">GitHub</text>

    <!-- Row 1 — matches "local-first" -->
    <text class="idx"   x="44" y="126" text-anchor="end">2</text>
    <text class="title" x="62" y="126">Local-first software: the seven ideals</text>
    <text class="meta"  x="722" y="126" text-anchor="end">★ —</text>
    <text class="meta"  x="784" y="126" text-anchor="end">X</text>

    <!-- Row 2 — no match -->
    <g class="unmatched">
      <text class="idx"   x="44" y="160" text-anchor="end">3</text>
      <text class="title" x="62" y="160">sqlite-vec: vector search in SQLite</text>
      <text class="meta"  x="722" y="160" text-anchor="end">★ 3.1k</text>
      <text class="meta"  x="784" y="160" text-anchor="end">GitHub</text>
    </g>

    <!-- Row 3 — no match -->
    <g class="unmatched">
      <text class="idx"   x="44" y="194" text-anchor="end">4</text>
      <text class="title" x="62" y="194">Notes on CRDT sync engines</text>
      <text class="meta"  x="722" y="194" text-anchor="end">★ —</text>
      <text class="meta"  x="784" y="194" text-anchor="end">X</text>
    </g>
  </g>
</svg>
